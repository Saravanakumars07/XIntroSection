<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intro section with dropdown navigation</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
  <img src="./assets/images/logo.svg" alt="snap's logo" class="logo"/>
  <button class="open-menu" id="openBtn" aria-label="open menu">
    <img src="./assets/images/icon-menu.svg" alt="">
  </button>
  <nav class="nav" id="nav">
    <button class="close-menu" id="closeBtn" aria-label="close menu">
      <img src="./assets/images/icon-close-menu.svg" alt="">
    </button>
    <div class="nav-links">
      <div class="nav-link">
        <button class="dropdown-btn">
          Features <img src="./assets/images/icon-arrow-down.svg" alt="" class="arrow" />
        </button>
        <div class="dropdown">
  <div class="dropdown-link"><a href="#" aria-label="Todo List"><img src="./assets/images/icon-todo.svg" alt="" />Todo List</a></div>
  <div class="dropdown-link"><a href="#" aria-label="Calendar"><img src="./assets/images/icon-calendar.svg" alt="" />Calendar</a></div>
  <div class="dropdown-link"><a href="#" aria-label="Reminders"><img src="./assets/images/icon-reminders.svg" alt="" />Reminders</a></div>
  <div class="dropdown-link"><a href="#" aria-label="Planning"><img src="./assets/images/icon-planning.svg" alt="" />Planning</a></div>
</div>
<div class="dropdown">
  <div class="dropdown-link"><a href="#" aria-label="History">History</a></div>
  <div class="dropdown-link"><a href="#" aria-label="Our Team">Our Team</a></div>
  <div class="dropdown-link"><a href="#" aria-label="Blog">Blog</a></div>
</div>
      </div>
      <a href="#" class="nav-link">Careers</a>
      <a href="#" class="nav-link">About</a>
    </div>
    <div class="registration">
      <button class="login">Login</button>
      <button class="register">Register</button>
    </div>
  </nav>
  <div class="overlay" id="overlay"></div> 
</header>

  <main>
    <picture class="main-picture">
      <source srcset="./assets/images/image-hero-desktop.png" media="(min-width: 768px)" />
      <img src="./assets/images/image-hero-mobile.png" alt="hero" />
    </picture>

    <div class="text-content">
      <h1>Make <br>remote work</h1>
      <p>Get your team in sync, no matter your location. Streamline processes, create team rituals, and watch productivity soar.</p>
      <button class="cta">Learn more</button>

      <div class="clients">
        <img src="./assets/images/client-databiz.svg" alt="Databiz" />
        <img src="./assets/images/client-audiophile.svg" alt="Audiophile" />
        <img src="./assets/images/client-meet.svg" alt="Meet" />
        <img src="./assets/images/client-maker.svg" alt="Maker" />
      </div>
    </div>
  </main>

  <footer>
    <div class="attribution">
      Challenge by <a href="https://crio.do" target="_blank" rel="noreferrer">Crio.do</a>. Coded by You
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
